# C³ pinned dependency lock with SHA256 hashes.
#
# Install with:
#   pip install --require-hashes --no-deps -r requirements.lock
#
# If a wheel is tampered with after publication, pip refuses to install.
# Hashes captured by `pip download` against PyPI on Python 3.11/3.12/3.13
# manylinux2014_x86_64. Verify independently with: make audit
#
# C-extension packages (pyyaml, pydantic-core) carry one hash per Python
# minor version because each minor ships a different ABI-specific wheel.
# Pure-Python packages carry one hash each.
#
# To regenerate after a version bump:
#   docker run --rm python:3.13-slim-bookworm bash -c '
#     for pyver in 3.11 3.12 3.13; do
#       pip download --only-binary=:all: --platform manylinux2014_x86_64 \
#         --python-version $pyver --dest /tmp/dl <pkg>==<ver>
#     done && sha256sum /tmp/dl/*.whl'

